<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Firma Ultra Crop Care</title>
    <style>
        .firma-container {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 10px;
            max-width: 600px;
        }
        .firma-table {
            border-collapse: collapse;
            border-spacing: 0;
        }
        .logo-cell {
            padding-right: 20px;
            vertical-align: middle;
        }
        .logo {
            width: 120px;
            height: auto;
        }
        .info-cell {
            padding-left: 20px;
            border-left: 2px solid #2ecc71;
            vertical-align: middle;
        }
        .nombre {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .cargo {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        .contacto {
            font-size: 14px;
            color: #444;
            line-height: 1.4;
        }
        .direccion {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="firma-container">
        <table class="firma-table">
            <tr>
                <td class="logo-cell">
                    <img src="logo.png" alt="Ultra Crop Care Logo" class="logo">
                </td>
                <td class="info-cell">
                    <div class="nombre">Eduardo Rojo Serrano</div>
                    <div class="cargo">Desarrollador de Software</div>
                    <div class="contacto">
                        📧 eduardo.rojo@ultracropcare.com<br>
                        📱 +34 123 456 789
                    </div>
                    <div class="direccion">
                        📍 Tu dirección
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
